<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我们的信箱</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; }
    .back-btn { font-size: 16px; color: #333; cursor: pointer; }
    .header-title { font-size: 18px; font-weight: 600; color: #333; }
    
    .letter-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px;}
    
    /* 更小的信封UI */
    .letter-card { 
        background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
        padding: 12px 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
        border: 1px solid rgba(255,255,255,0.9); position: relative; overflow: hidden;
        font-size: 14px;
    }
    .letter-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #c7b39e; }
    .letter-card.other::before { background: #8fb9aa; }
    .letter-meta { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-bottom: 6px; }
    .letter-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 5px; }
    .letter-preview { font-size: 13px; color: #666; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .letter-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .letter-actions button { background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.05); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #555; cursor: pointer; }
    .letter-actions button.delete { color: #ff4d4f; }

    .write-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; border: none; padding: 10px 25px; font-size: 15px; cursor: pointer; border-radius: 25px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    
    .write-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; flex-direction: column; padding: 20px; }
    .write-modal.active { display: flex; }
    .write-modal input { border: none; border-bottom: 1px solid #eee; padding: 10px 0; font-size: 18px; margin-bottom: 15px; outline: none; font-weight: 600; }
    .write-modal textarea { flex: 1; border: none; outline: none; font-size: 15px; line-height: 1.6; resize: none; }
    .modal-footer { display: flex; gap: 10px; margin-top: 15px; }
    .modal-footer button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
    .modal-footer button.cancel { background: #f0f0f0; color: #666; }
    .modal-footer button.send { background: #333; color: #fff; }
</style>
</head>
<body>
    <div class="header">
        <div class="back-btn" onclick="window.location.href='index.html'">&lt; 返回</div>
        <div class="header-title">信箱</div><div style="width: 40px;"></div>
    </div>
    <div class="letter-list" id="letterList"></div>
    <button class="write-btn" onclick="openWriteModal()">写一封信 ✉️</button>

    <div class="write-modal" id="writeModal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-size:18px; font-weight:600;" id="modalTitle">写新信</span>
            <span style="font-size:14px; color:#999; cursor:pointer;" onclick="closeWriteModal()">取消</span>
        </div>
        <input type="text" id="letterTitle" placeholder="主题...">
        <textarea id="letterContent" placeholder="写下你想说的话..."></textarea>
        <div class="modal-footer"><button class="send" onclick="submitLetter()">发送</button></div>
    </div>

<script>
    const letterList = document.getElementById('letterList');
    let letters = JSON.parse(localStorage.getItem('myLetters')) || [];
    let cardLibrary = JSON.parse(localStorage.getItem('chatCards')) || [{ text: '收到啦！' }];
    let currentReplyId = null;

    window.onload = () => {
        renderLetters();
        const customCss = localStorage.getItem('customCssUI');
        if (customCss) { const style = document.createElement('style'); style.innerHTML = customCss; document.head.appendChild(style); }
    };

    function renderLetters() {
        letterList.innerHTML = '';
        if (letters.length === 0) { letterList.innerHTML = '<div style="text-align:center; color:#999; margin-top:50px; font-size:14px;">信箱空空如也~</div>'; return; }
        [...letters].reverse().forEach(letter => {
            const card = document.createElement('div');
            card.className = `letter-card ${letter.sender === 'me' ? '' : 'other'}`;
            card.innerHTML = `
                <div class="letter-meta"><span>${letter.sender === 'me' ? '来自 我' : '来自 Ta'}</span><span>${letter.time}</span></div>
                <div class="letter-title">${letter.title || '无题'}</div>
                <div class="letter-preview">${letter.content}</div>
                <div class="letter-actions">
                    <button onclick="openReply('${letter.id}')">回信</button>
                    <button class="delete" onclick="deleteLetter('${letter.id}')">删除</button>
                </div>
            `;
            letterList.appendChild(card);
        });
    }

    function openWriteModal() {
        currentReplyId = null; document.getElementById('modalTitle').innerText = '写一封新信';
        document.getElementById('letterTitle').value = ''; document.getElementById('letterContent').value = '';
        document.getElementById('writeModal').classList.add('active');
    }

    function openReply(id) {
        currentReplyId = id; const original = letters.find(l => l.id === id);
        document.getElementById('modalTitle').innerText = '回信';
        document.getElementById('letterTitle').value = `回复：${original.title}`;
        document.getElementById('letterContent').value = '';
        document.getElementById('writeModal').classList.add('active');
    }

    function closeWriteModal() { document.getElementById('writeModal').classList.remove('active'); }

    function submitLetter() {
        const title = document.getElementById('letterTitle').value.trim();
        const content = document.getElementById('letterContent').value.trim();
        if (!content) return alert('不能为空');
        const now = new Date();
        letters.push({ id: Date.now().toString(), sender: 'me', title: title, content: content, time: `${now.getMonth()+1}月${now.getDate()}日` });
        saveLetters(); closeWriteModal();
        // 延迟回信，从字卡库抽
        setTimeout(() => {
            const replyText = cardLibrary[Math.floor(Math.random() * cardLibrary.length)].text;
            letters.push({ id: Date.now().toString(), sender: 'other', title: '回信', content: replyText, time: `${now.getMonth()+1}月${now.getDate()}日` });
            saveLetters(); alert('对方回信了！(内容从字卡库抽取)');
        }, 5000);
    }

    function deleteLetter(id) { if (confirm('删除这封信？')) { letters = letters.filter(l => l.id !== id); saveLetters(); } }
    function saveLetters() { localStorage.setItem('myLetters', JSON.stringify(letters)); renderLetters(); }
</script>
</body>
</html>
