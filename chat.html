<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聊天</title>
<style>
    :root { --bubble-font-size: 15px; --glass-bg: rgba(255, 255, 255, 0.65); --glass-border: rgba(255, 255, 255, 0.8); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .header { background: var(--glass-bg); backdrop-filter: blur(20px); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar { width: 36px; height: 36px; border-radius: 10px; background: #ccc; object-fit: cover; border: 1px solid #eee; }
    .name { font-weight: 600; font-size: 16px; color: #333; }
    .more-btn { font-size: 26px; font-weight: bold; color: #333; padding: 0 5px; cursor: pointer; }
    
    .chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
    .msg-row { display: flex; gap: 10px; max-width: 85%; }
    .msg-row.left { align-self: flex-start; } .msg-row.right { align-self: flex-end; flex-direction: row-reverse; }
    
    .bubble { padding: 10px 14px; border-radius: 12px; font-size: var(--bubble-font-size); line-height: 1.5; word-break: break-all; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .left .bubble { background: #fff; border-top-left-radius: 2px; color: #333; }
    .right .bubble { background: #95ec69; border-top-right-radius: 2px; color: #000; }
    .status { font-size: 10px; color: #999; align-self: flex-end; margin: 0 5px; }
    .img-bubble { max-width: 150px; max-height: 200px; border-radius: 8px; object-fit: cover; }
    .emoji-img-bubble { width: 60px; height: 60px; object-fit: cover; background: transparent; }
    
    .pat-bar { padding: 5px 15px; text-align: right; }
    .pat-btn { font-size: 12px; color: #fff; background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 15px; cursor: pointer; }

    .input-area { background: var(--glass-bg); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); padding: 10px; display: flex; flex-direction: column; gap: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .input-row { display: flex; align-items: flex-end; gap: 10px; }
    .icon { font-size: 26px; color: #555; cursor: pointer; padding-bottom: 5px; }
    .input-box { flex: 1; border: none; border-radius: 8px; padding: 10px; font-size: 15px; outline: none; resize: none; max-height: 100px; background: #fff; }
    .send-btn { background: #07c160; color: #fff; border: none; border-radius: 8px; padding: 8px 15px; font-size: 15px; cursor: pointer; display: none; height: 38px;}
    .send-btn.show { display: block; }
    
    .extra-panel { display: none; background: transparent; padding: 15px; border-top: 1px solid rgba(0,0,0,0.05); }
    .extra-panel.active { display: block; }
    .grid-panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .grid-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    .grid-icon-glass { width: 55px; height: 55px; background: rgba(255,255,255,0.8); border-radius: 18px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .grid-icon-glass svg { width: 26px; height: 26px; stroke: #555; stroke-width: 1.5; fill: none; }
    .grid-text { font-size: 12px; color: #666; }
    
    .emoji-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #333; font-size: 14px;}
    .emoji-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .emoji-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; background: #eee; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; justify-content: flex-end; flex-direction: column; }
    .modal-content { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-height: 80vh; overflow-y: auto; }
    .menu-item { font-size: 16px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; color: #333; }
    .context-menu { display: none; position: fixed; background: #fff; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.15); z-index: 2000; flex-direction: column; padding: 5px; }
    .context-menu div { padding: 10px 15px; font-size: 14px; cursor: pointer; }

    /* 时间范围设置 UI */
    .time-setting-box { background: #f9f9f9; border-radius: 12px; padding: 15px; margin-top: 10px; }
    .time-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .time-col { flex: 1; text-align: center; }
    .time-col label { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
    .time-col input { width: 100%; text-align: center; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; }
    .preset-btns { display: flex; gap: 8px; }
    .preset-btn { flex: 1; padding: 8px 0; background: #fff; border: 1px solid #eee; border-radius: 8px; font-size: 12px; color: #555; cursor: pointer; }
    .preset-btn:active { background: #07c160; color: #fff; }

    /* 通话 */
    .call-full-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 4000; flex-direction: column; align-items: center; justify-content: space-between; padding: 50px 20px; }
    .call-full-screen.active { display: flex; }
    .call-top-info { text-align: center; color: #fff; }
    .call-top-info .status { font-size: 16px; margin-bottom: 30px; color: #aaa; }
    .call-top-info img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); margin-bottom: 15px; }
    .call-top-info .name { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
    .call-top-info .timer { font-size: 18px; color: #07c160; }
    .call-controls { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; }
    .call-btn-row { display: flex; gap: 40px; }
    .call-btn-circle { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; }
    .call-btn-circle svg { width: 28px; height: 28px; fill: #fff; }
    .call-btn-circle.active { background: #fff; } .call-btn-circle.active svg { fill: #333; }
    .hangup-btn { width: 70px; height: 70px; background: #ff4d4f; }
    .minimize-btn { background: rgba(255,255,255,0.2); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; }

    .call-capsule { display: none; position: fixed; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 50px; background: #222; border-radius: 30px; z-index: 3000; box-shadow: 0 8px 25px rgba(0,0,0,0.3); align-items: center; justify-content: space-between; padding: 5px 10px; cursor: pointer; }
    .call-capsule.active { display: flex; }
    .capsule-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .capsule-info { flex: 1; display: flex; align-items: center; gap: 8px; margin-left: 10px; }
    .status-dot { width: 6px; height: 6px; background: #07c160; border-radius: 50%; }
    .capsule-time { font-size: 16px; color: #07c160; font-weight: 600; }
    .capsule-hangup { width: 36px; height: 36px; border-radius: 50%; background: #ff4d4f; display: flex; justify-content: center; align-items: center; }
    .capsule-hangup svg { width: 18px; height: 18px; fill: #fff; }

    /* 字卡 */
    .full-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f7f7f7; z-index: 1000; flex-direction: column; }
    .fp-header { background: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; }
    .fp-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .card-list-container { background: #fff; border-radius: 8px; padding: 0 15px; max-height: 400px; overflow-y: auto; border: 1px solid #eee;}
    .card-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 15px; }
    .card-item .del-icon { color: #ccc; font-size: 18px; cursor: pointer; }
    .multi-input-area { background: #fff; padding: 15px; border-radius: 8px; display: flex; gap: 10px; border: 1px solid #eee;}
    .multi-input-area textarea { flex: 1; height: 80px; border: none; outline: none; resize: none; font-size: 14px; }
    .btn-write { background: #333; color: #fff; padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer;}
</style>
</head>
<body>

    <div class="header">
        <div class="header-left" onclick="goBack()">
            <span style="font-size:20px; color:#333; margin-right:5px;">&lt;</span>
            <img src="" id="headerAvatar" class="avatar">
            <div class="name" id="headerName">loveu.♡</div>
        </div>
        <div class="more-btn" onclick="toggleMenu()">⋮</div>
    </div>
    
    <div class="chat-box" id="chatBox"></div>
    
    <div class="pat-bar"><span class="pat-btn" onclick="triggerPat()">拍了拍对方</span></div>

    <div class="input-area">
        <div class="input-row">
            <div class="icon" onclick="togglePanel('extraPanel')">⊕</div>
            <textarea class="input-box" id="inputMsg" rows="1" placeholder="输入消息..." oninput="onType()"></textarea>
            <div class="icon" onclick="togglePanel('emojiPanel')">😊</div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        
        <div class="extra-panel" id="emojiPanel">
            <div class="emoji-header">
                <span>我的表情包</span>
                <span style="color: #07c160; font-size: 13px; cursor: pointer;" onclick="document.getElementById('emojiUploadMy').click()">+ 从相册添加</span>
            </div>
            <div class="emoji-grid" id="myEmojiGrid"></div>
            <input type="file" id="emojiUploadMy" accept="image/*" style="display: none;" onchange="handleEmojiUpload(event, 'my')">
        </div>

        <div class="extra-panel" id="extraPanel">
            <div class="grid-panel">
                <div class="grid-item" onclick="document.getElementById('imgUpload').click()">
                    <div class="grid-icon-glass"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></div>
                    <div class="grid-text">相册</div>
                </div>
                <div class="grid-item" onclick="startCall('video')">
                    <div class="grid-icon-glass"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></div>
                    <div class="grid-text">视频通话</div>
                </div>
                <div class="grid-item" onclick="startCall('voice')">
                    <div class="grid-icon-glass"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
                    <div class="grid-text">语音通话</div>
                </div>
            </div>
            <input type="file" id="imgUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- 全屏通话大窗 -->
    <div class="call-full-screen" id="callFullScreen">
        <div class="call-top-info">
            <div class="status" id="callStatusText">正在呼叫...</div>
            <img src="" id="callBigAvatar">
            <div class="name" id="callBigName">loveu.♡</div>
            <div class="timer" id="callBigTimer" style="display:none;">00:00</div>
        </div>
        <div class="call-controls">
            <div class="call-btn-row" id="callActionBtns" style="display:none;">
                <div class="call-btn-circle" onclick="this.classList.toggle('active')"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg></div>
                <div class="call-btn-circle" onclick="this.classList.toggle('active')"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></div>
            </div>
            <div class="call-btn-circle hangup-btn" onclick="endCall()"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></div>
            <div class="minimize-btn" onclick="minimizeCall()">— 最小化</div>
        </div>
    </div>

    <!-- 灵动岛胶囊 -->
    <div class="call-capsule" id="callCapsule" onclick="restoreCall()">
        <img src="" id="capsuleAvatar" class="capsule-avatar">
        <div class="capsule-info"><div class="status-dot"></div><div class="capsule-time" id="capsuleTimer">00:00</div></div>
        <div class="capsule-hangup" onclick="event.stopPropagation(); endCall()"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"></path></svg></div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div onclick="actionQuote()">引用</div><div onclick="actionRecall()" id="recallBtn">撤回</div><div onclick="actionDelete()" id="deleteBtn">删除</div>
    </div>

    <!-- 菜单 -->
    <div class="modal" id="menuModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="menu-item" onclick="openProfileModal()">更换头像 / 名字</div>
            <div class="menu-item" onclick="openCardManager()">字卡库管理</div>
            <div class="menu-item" onclick="openReplyTimeSetting()">角色回复时间范围</div> <!-- 新时间设置入口 -->
            <div class="menu-item" style="flex-direction: column; align-items: flex-start; display: flex;">
                <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:10px;">
                    <span>气泡字体大小调节</span><span id="fontSizeVal">15px</span>
                </div>
                <input type="range" min="12" max="22" value="15" id="fontSlider" style="width:100%;" oninput="changeBubbleSize(this.value)">
            </div>
            <div class="menu-item" onclick="openEmojiManager()">Ta的表情包管理</div>
            <div class="menu-item" onclick="closeModal(event)" style="color:#999; border:none; text-align: center;">取消</div>
        </div>
    </div>

    <!-- 回复时间设置弹窗 -->
    <div class="modal" id="replyTimeModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="text-align:center; margin-bottom:10px;">角色回复时间范围</h3>
            <div class="time-setting-box">
                <div class="time-row">
                    <div class="time-col">
                        <label>最短回复 (分钟)</label>
                        <input type="number" id="minTimeInput" value="30">
                    </div>
                    <div class="time-col">
                        <label>最长回复 (分钟)</label>
                        <input type="number" id="maxTimeInput" value="240">
                    </div>
                </div>
                <div class="preset-btns">
                    <div class="preset-btn" onclick="setPresetTime(30, 240)">默认 (30分~4h)</div>
                    <div class="preset-btn" onclick="setPresetTime(1, 3)">极速测试 (1~3分)</div>
                    <div class="preset-btn" onclick="setPresetTime(60, 480)">慢递 (1~8h)</div>
                </div>
                <button onclick="saveReplyTime()" style="width:100%; padding:12px; background:#07c160; color:#fff; border:none; border-radius:8px; margin-top:15px; font-size:16px;">保存</button>
            </div>
        </div>
    </div>

    <!-- 字卡库管理 -->
    <div class="full-page" id="cardManager">
        <div class="fp-header">
            <div style="width:30px; cursor:pointer;" onclick="document.getElementById('cardManager').style.display='none'">&lt;</div>
            <div class="fp-title">字卡库</div><div style="width:30px;"></div>
        </div>
        <div class="fp-body">
            <div class="card-list-container" id="cardListContainer"></div>
            <div class="multi-input-area">
                <textarea id="batchTextArea" placeholder="输入字卡，多行（一行一个）"></textarea>
                <button class="btn-write" onclick="writeBatch()">写入</button>
            </div>
        </div>
    </div>

    <div class="modal" id="emojiManager" onclick="closeModal(event)" style="background: #fff;">
        <div style="width: 100%; height: 100%; padding: 20px; display: flex; flex-direction: column;" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h3 style="font-size: 18px;">Ta的表情包库</h3>
                <span style="color: #07c160; font-weight: bold; cursor: pointer;" onclick="document.getElementById('emojiUploadOther').click()">+ 添加</span>
            </div>
            <div class="emoji-grid" id="otherEmojiManagerGrid" style="overflow-y:auto; flex:1; align-content: flex-start;"></div>
            <button onclick="closeModal(event)" style="width:100%; padding:15px; background:#f0f0f0; border:none; border-radius:10px; margin-top:20px; font-size:16px;">关闭</button>
            <input type="file" id="emojiUploadOther" accept="image/*" style="display: none;" onchange="handleEmojiUpload(event, 'other')">
        </div>
    </div>

    <div class="modal" id="profileModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="text-align:center;">修改资料</h3>
            <div style="border:1px solid #eee; padding:10px; border-radius:8px; margin-bottom:10px;">
                <div style="font-weight:bold; margin-bottom:10px;">我的资料</div>
                <input type="text" id="myNameInput" placeholder="我的名字" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ccc; border-radius:5px;">
                <div style="font-size:12px; color:#666;">头像：<input type="file" id="myAvatarUpload" accept="image/*"></div>
            </div>
            <div style="border:1px solid #eee; padding:10px; border-radius:8px;">
                <div style="font-weight:bold; margin-bottom:10px;">Ta的资料</div>
                <input type="text" id="otherNameInput" placeholder="Ta的名字" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ccc; border-radius:5px;">
                <div style="font-size:12px; color:#666;">头像：<input type="file" id="otherAvatarUpload" accept="image/*"></div>
            </div>
            <button onclick="saveProfile()" style="padding:12px; background:#07c160; color:#fff; border:none; border-radius:8px; margin-top:10px; font-size:16px;">保存</button>
        </div>
    </div>

<script>
    const chatBox = document.getElementById('chatBox'), inputMsg = document.getElementById('inputMsg'), sendBtn = document.getElementById('sendBtn');
    let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
    let cardLibrary = JSON.parse(localStorage.getItem('chatCards')) || [{ group: '默认', text: '你好呀' }];
    let myEmojis = JSON.parse(localStorage.getItem('myEmojis')) || [], otherEmojis = JSON.parse(localStorage.getItem('otherEmojis')) || [];
    let config = JSON.parse(localStorage.getItem('chatConfig')) || { myName: '我', otherName: 'Ta', myAvatar: '', otherAvatar: '', bubbleSize: '15px' };
    // 读取回复时间设置，默认最短30分，最长240分
    let replyTimeConfig = JSON.parse(localStorage.getItem('replyTimeConfig')) || { min: 30, max: 240 };

    window.onload = () => {
    applyConfig();
    renderMessages();
    renderEmojiGrids();
    
    // ===== 读取全站UI美化代码 =====
    const cssUI = localStorage.getItem('customCssUI');
    if (cssUI) { 
        const style = document.createElement('style'); 
        style.innerHTML = cssUI; 
        document.head.appendChild(style); 
    }
    
    // ===== 读取气泡美化代码 =====
    const cssBubble = localStorage.getItem('customCssBubble');
    if (cssBubble) { 
        const style = document.createElement('style'); 
        style.innerHTML = cssBubble; 
        document.head.appendChild(style); 
    }
    // ===============================
};renderMessages(); renderEmojiGrids(); };
    function applyConfig() {
        document.getElementById('headerName').innerText = config.otherName;
        document.getElementById('headerAvatar').src = config.otherAvatar || ''; 
        document.documentElement.style.setProperty('--bubble-font-size', config.bubbleSize);
    }

    function renderMessages() {
        chatBox.innerHTML = '';
        chatHistory.forEach((msg) => {
            const row = document.createElement('div'); row.className = `msg-row ${msg.sender}`;
            let contentHtml = '';
            if (msg.type === 'text') contentHtml = `<div class="bubble" onclick="showContextMenu(event, '${msg.id}')">${msg.content}</div>`;
            else if (msg.type === 'emoji') contentHtml = `<img src="${msg.content}" class="emoji-img-bubble" onclick="showContextMenu(event, '${msg.id}')">`;
            else if (msg.type === 'image') contentHtml = `<img src="${msg.content}" class="img-bubble" onclick="showContextMenu(event, '${msg.id}')">`;
            else if (msg.type === 'pat') contentHtml = `<div style="color:#999; font-size:12px; text-align:center; width:100%;">${msg.content}</div>`;
            let avatarUrl = msg.sender === 'right' ? (config.myAvatar || '') : (config.otherAvatar || '');
            row.innerHTML = `<img src="${avatarUrl}" class="avatar"><div style="display:flex; flex-direction:column; align-items: ${msg.sender === 'right' ? 'flex-end' : 'flex-start'};">${contentHtml}</div>`;
            chatBox.appendChild(row);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function onType() { sendBtn.classList.toggle('show', inputMsg.value.trim() !== ''); }
    function saveAndRender() { localStorage.setItem('chatHistory', JSON.stringify(chatHistory)); renderMessages(); }
    
    function sendMessage() {
        if (!inputMsg.value.trim()) return;
        chatHistory.push({ id: Date.now().toString(), sender: 'right', type: 'text', content: inputMsg.value.trim() });
        inputMsg.value = ''; onType(); saveAndRender(); triggerSmartReply();
    }
    function handleImageUpload(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { chatHistory.push({ id: Date.now().toString(), sender: 'right', type: 'image', content: e.target.result }); saveAndRender(); togglePanel('extraPanel'); triggerSmartReply(); };
        reader.readAsDataURL(file); event.target.value = '';
    }
    function renderEmojiGrids() {
        document.getElementById('myEmojiGrid').innerHTML = myEmojis.map(url => `<img src="${url}" class="emoji-img" onclick="sendEmoji('${url}')">`).join('');
        document.getElementById('otherEmojiManagerGrid').innerHTML = otherEmojis.map((url, i) => `<div style="position:relative;"><img src="${url}" class="emoji-img" style="width:60px;height:60px;"><div style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:20px; height:20px; text-align:center; line-height:20px; font-size:12px; cursor:pointer;" onclick="deleteEmoji(${i})">×</div></div>`).join('');
    }
    function sendEmoji(url) { chatHistory.push({ id: Date.now().toString(), sender: 'right', type: 'emoji', content: url }); saveAndRender(); togglePanel('emojiPanel'); triggerSmartReply(); }
    function handleEmojiUpload(event, who) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const base64 = e.target.result;
            if (who === 'my' && !myEmojis.includes(base64)) { myEmojis.push(base64); localStorage.setItem('myEmojis', JSON.stringify(myEmojis)); }
            else if (who === 'other' && !otherEmojis.includes(base64)) { otherEmojis.push(base64); localStorage.setItem('otherEmojis', JSON.stringify(otherEmojis)); }
            renderEmojiGrids();
        };
        reader.readAsDataURL(file); event.target.value = '';
    }
    function deleteEmoji(i) { if(confirm('删除？')) { otherEmojis.splice(i, 1); localStorage.setItem('otherEmojis', JSON.stringify(otherEmojis)); renderEmojiGrids(); } }

    // ======== 智能回复（带时间延迟） ========
    function triggerSmartReply() {
        // 计算随机延迟时间（分钟）
        let min = replyTimeConfig.min, max = replyTimeConfig.max;
        let randomMins = Math.floor(Math.random() * (max - min + 1)) + min;
        
        // 为了让你测试时不被气死，如果你设置的延迟特别长，浏览器可能会休眠。
        // 但为了还原真实，这里确实会等这么久才触发。
        console.log(`设定：对方将在 ${randomMins} 分钟后回复...`);
        
        // 演示用：如果大于 5 分钟，我先弄个 10 秒的定时器给你看效果，但数据保存的是真实分钟数
        // 实际在后台它会在时间到了之后执行（页面不能关）
        let waitTimeMs = randomMins * 60 * 1000; 
        
        setTimeout(() => {
            const isEmoji = Math.random() < 0.3 && otherEmojis.length > 0;
            if (isEmoji) { chatHistory.push({ id: Date.now().toString(), sender: 'left', type: 'emoji', content: otherEmojis[Math.floor(Math.random() * otherEmojis.length)] }); }
            else if (cardLibrary.length > 0) { chatHistory.push({ id: Date.now().toString(), sender: 'left', type: 'text', content: cardLibrary[Math.floor(Math.random() * cardLibrary.length)].text }); }
            saveAndRender();
        }, waitTimeMs);
    }

    // ======== 回复时间设置 ========
    function openReplyTimeSetting() {
        closeModal();
        document.getElementById('minTimeInput').value = replyTimeConfig.min;
        document.getElementById('maxTimeInput').value = replyTimeConfig.max;
        document.getElementById('replyTimeModal').style.display = 'flex';
    }
    function setPresetTime(min, max) {
        document.getElementById('minTimeInput').value = min;
        document.getElementById('maxTimeInput').value = max;
    }
    function saveReplyTime() {
        let min = parseInt(document.getElementById('minTimeInput').value);
        let max = parseInt(document.getElementById('maxTimeInput').value);
        if(min > max) return alert('最短时间不能大于最长时间！');
        replyTimeConfig = { min, max };
        localStorage.setItem('replyTimeConfig', JSON.stringify(replyTimeConfig));
        closeModal();
        alert('回复时间设置成功！');
    }

    // ======== 菜单与基础 ========
    function togglePanel(id) { document.querySelectorAll('.extra-panel').forEach(p => p.classList.toggle('active', p.id === id && !p.classList.contains('active'))); }
    function toggleMenu() { document.getElementById('menuModal').style.display = 'flex'; }
    function closeModal(event) { if (event && event.target.className === 'modal') event.target.style.display = 'none'; else document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    function changeBubbleSize(val) { config.bubbleSize = val + 'px'; document.documentElement.style.setProperty('--bubble-font-size', config.bubbleSize); localStorage.setItem('chatConfig', JSON.stringify(config)); }
    
    function openProfileModal() { document.getElementById('myNameInput').value = config.myName; document.getElementById('otherNameInput').value = config.otherName; document.getElementById('profileModal').style.display = 'flex'; }
    function saveProfile() {
        config.myName = document.getElementById('myNameInput').value.trim() || '我'; config.otherName = document.getElementById('otherNameInput').value.trim() || 'Ta';
        const myF = document.getElementById('myAvatarUpload').files[0], otF = document.getElementById('otherAvatarUpload').files[0]; let c = 0;
        const check = () => { if(++c >= (myF?1:0)+(otF?1:0)) { localStorage.setItem('chatConfig', JSON.stringify(config)); applyConfig(); renderMessages(); closeModal(); } };
        if(myF) { const r = new FileReader(); r.onload = e => { config.myAvatar = e.target.result; check(); }; r.readAsDataURL(myF); }
        if(otF) { const r = new FileReader(); r.onload = e => { config.otherAvatar = e.target.result; check(); }; r.readAsDataURL(otF); }
        if(!myF && !otF) { localStorage.setItem('chatConfig', JSON.stringify(config)); applyConfig(); renderMessages(); closeModal(); }
    }
    function openEmojiManager() { closeModal(); document.getElementById('emojiManager').style.display = 'flex'; }

    // ======== 通话 ========
    let callTimer = null, callSecs = 0, isCallActive = false;
    function startCall(type) {
        togglePanel('extraPanel'); isCallActive = false; callSecs = 0;
        document.getElementById('callBigAvatar').src = config.otherAvatar || '';
        document.getElementById('callBigName').innerText = config.otherName;
        document.getElementById('callStatusText').innerText = type === 'video' ? '视频呼叫中...' : '语音呼叫中...';
        document.getElementById('callBigTimer').style.display = 'none';
        document.getElementById('callActionBtns').style.display = 'none';
        document.getElementById('callFullScreen').classList.add('active');
        document.getElementById('callCapsule').classList.remove('active');

        setTimeout(() => {
            if(document.getElementById('callFullScreen').classList.contains('active') || document.getElementById('callCapsule').classList.contains('active')) {
                isCallActive = true; document.getElementById('callStatusText').innerText = type === 'video' ? '视频通话中' : '语音通话中';
                document.getElementById('callBigTimer').style.display = 'block'; document.getElementById('callActionBtns').style.display = 'flex'; startTimer();
            }
        }, 2500);
    }
    function startTimer() { if(callTimer) clearInterval(callTimer); callTimer = setInterval(() => { callSecs++; const m = Math.floor(callSecs / 60).toString().padStart(2, '0'); const s = (callSecs % 60).toString().padStart(2, '0'); const t = `${m}:${s}`; document.getElementById('callBigTimer').innerText = t; document.getElementById('capsuleTimer').innerText = t; }, 1000); }
    function minimizeCall() { document.getElementById('callFullScreen').classList.remove('active'); document.getElementById('callCapsule').classList.add('active'); document.getElementById('capsuleAvatar').src = config.otherAvatar || ''; }
    function restoreCall() { if(!isCallActive) return; document.getElementById('callCapsule').classList.remove('active'); document.getElementById('callFullScreen').classList.add('active'); }
    function endCall() { document.getElementById('callFullScreen').classList.remove('active'); document.getElementById('callCapsule').classList.remove('active'); if(callTimer) clearInterval(callTimer); }

    // ======== 字卡 ========
    function openCardManager() { closeModal(); document.getElementById('cardManager').style.display = 'flex'; renderCardList(); }
    function renderCardList() { document.getElementById('cardListContainer').innerHTML = cardLibrary.map((c, i) => `<div class="card-item"><span>${c.text}</span><span class="del-icon" onclick="cardLibrary.splice(${i},1);saveCards()">×</span></div>`).join(''); }
    function writeBatch() { const text = document.getElementById('batchTextArea').value; if(!text) return; text.split('\n').forEach(l => { if(l.trim() && !cardLibrary.some(c=>c.text===l.trim())) cardLibrary.push({group:'默认', text:l.trim()}); }); document.getElementById('batchTextArea').value = ''; saveCards(); }
    function saveCards() { localStorage.setItem('chatCards', JSON.stringify(cardLibrary)); renderCardList(); }

    function goBack() { window.location.href = 'index.html'; }
</script>
</body>
</html>
