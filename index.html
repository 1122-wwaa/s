<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我们的私密空间</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 15vh; overflow: hidden;}
    
    .settings-icon { position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(255,255,255,0.6); border-radius: 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #fff;}
    .settings-icon svg { width: 24px; height: 24px; stroke: #555; stroke-width: 2; fill: none; }

    .anniversary-box { text-align: center; margin-bottom: 60px; }
    .anniversary-title { font-size: 14px; color: #888; letter-spacing: 2px; margin-bottom: 10px; }
    .anniversary-days { font-size: 54px; font-weight: 300; color: #333; display: flex; align-items: baseline; justify-content: center; gap: 5px; }
    .anniversary-days span { font-size: 18px; color: #666; }
    .set-btn { margin-top: 15px; padding: 8px 20px; background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.05); border-radius: 20px; font-size: 13px; color: #555; cursor: pointer; }

    .icon-container { display: flex; gap: 25px; }
    .icon-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .icon-circle-glass { width: 75px; height: 75px; background: rgba(255,255,255,0.6); border-radius: 22px; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 12px; }
    .icon-circle-glass svg { width: 36px; height: 36px; stroke: #444; stroke-width: 1.5; fill: none; }
    .icon-text { font-size: 15px; color: #333; font-weight: 500; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; }
    .modal-content input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin: 15px 0; font-size: 16px; outline: none; }
    .modal-content button { width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

    <div class="settings-icon" onclick="window.location.href='settings.html'">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </div>

    <div class="anniversary-box">
        <div class="anniversary-title">在一起已经</div>
        <div class="anniversary-days"><div id="daysCount">--</div> <span>天</span></div>
        <button class="set-btn" onclick="openSetDate()">设置纪念日</button>
    </div>

    <div class="icon-container">
        <!-- 这里直接跳转 chat.html -->
        <div class="icon-item" onclick="window.location.href='chat.html'">
            <div class="icon-circle-glass">
                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </div>
            <div class="icon-text">聊天</div>
        </div>
        <div class="icon-item" onclick="window.location.href='mail.html'">
            <div class="icon-circle-glass">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </div>
            <div class="icon-text">信箱</div>
        </div>
        <div class="icon-item" onclick="window.location.href='moments.html'">
            <div class="icon-circle-glass">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
            </div>
            <div class="icon-text">朋友圈</div>
        </div>
    </div>

    <div class="modal" id="dateModal">
        <div class="modal-content">
            <h3 style="font-size: 18px; color: #333; margin-bottom: 10px;">设置纪念日</h3>
            <input type="date" id="dateInput">
            <button onclick="saveDate()">保存</button>
        </div>
    </div>

    <script>
        function calculateDays(startDate) {
            const now = new Date(); const start = new Date(startDate);
            now.setHours(0, 0, 0, 0); start.setHours(0, 0, 0, 0);
            const diffTime = Math.abs(now - start);
            document.getElementById('daysCount').innerText = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }
        function openSetDate() {
            const savedDate = localStorage.getItem('anniversaryDate');
            if (savedDate) document.getElementById('dateInput').value = savedDate;
            document.getElementById('dateModal').style.display = 'flex';
        }
        function saveDate() {
            const dateVal = document.getElementById('dateInput').value;
            if (dateVal) {
                localStorage.setItem('anniversaryDate', dateVal);
                calculateDays(dateVal);
                document.getElementById('dateModal').style.display = 'none';
            }
        }
        window.onload = function() {
            const savedDate = localStorage.getItem('anniversaryDate');
            if (savedDate) calculateDays(savedDate);
            else document.getElementById('daysCount').innerText = '0';
            
            const customCss = localStorage.getItem('customCss');
            if (customCss) {
                const style = document.createElement('style');
                style.innerHTML = customCss;
                document.head.appendChild(style);
            }
        };
    </script>
</body>
</html>
